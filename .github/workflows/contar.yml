name: Contar dias sin operar
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env: { DIARIO_KEY: "${{ secrets.DIARIO_KEY }}" }
        run: |
          python -c "
          from planilla import bajar
          d=bajar()
          for f,v in sorted(d.get('days',{}).items()):
              s=(v or {}).get('skip')
              if s: print(f, s.get('reason'))
          print('trades:', sorted(t.get('date') for t in d['trades'].values()))
          "
