name: Publicar en Instagram
on:
  schedule:
    # GitHub atrasa los horarios programados (medido 20-22/11: de 3,5 a 5,5 horas). Por eso el robot corre muchas
    # veces por día (cada 20-40 min de 12:30 a 0 h ART; el repo es público, no cuesta) y publicar.py --auto decide según la hora argentina real: reels desde las 12:30, carruseles desde las 19:00.
    # Minutos "raros" a propósito: a la hora en punto GitHub se atrasa más.
    - cron: "37 15 * * *"  # 12:37 ART
    - cron: "7 16 * * *"  # 13:07 ART
    - cron: "47 16 * * *"  # 13:47 ART
    - cron: "27 17 * * *"  # 14:27 ART
    - cron: "17 18 * * *"  # 15:17 ART
    - cron: "57 18 * * *"  # 15:57 ART
    - cron: "37 19 * * *"  # 16:37 ART
    - cron: "17 20 * * *"  # 17:17 ART
    - cron: "57 20 * * *"  # 17:57 ART
    - cron: "37 21 * * *"  # 18:37 ART
    - cron: "7 22 * * *"  # 19:07 ART
    - cron: "27 22 * * *"  # 19:27 ART
    - cron: "52 22 * * *"  # 19:52 ART
    - cron: "17 23 * * *"  # 20:17 ART
    - cron: "42 23 * * *"  # 20:42 ART
    - cron: "12 0 * * *"  # 21:12 ART
    - cron: "47 0 * * *"  # 21:47 ART
    - cron: "17 1 * * *"  # 22:17 ART
    - cron: "52 1 * * *"  # 22:52 ART
    - cron: "27 2 * * *"  # 23:27 ART
    - cron: "52 2 * * *"  # 23:52 ART
  push:
    # El control en la nube (rutina de Claude, 13:00 y 20:00 ART) toca disparador.txt cuando algo no salió:
    # así el robot corre en el momento aunque los horarios de GitHub vengan atrasados.
    branches: [main]
    paths: [disparador.txt]
  workflow_dispatch:
    inputs:
      planilla_prueba:
        description: "Solo prueba: arma la planilla de este viernes (AAAA-MM-DD) sin publicar"
        required: false
permissions:
  contents: write
concurrency:
  group: publicar   # nunca dos corridas a la vez: evita publicar dos veces lo mismo
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # siempre lo último (con lo que ya registró la corrida anterior)
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Prueba de planilla (no publica nada)
        if: ${{ inputs.planilla_prueba != '' }}
        env:
          DIARIO_KEY: ${{ secrets.DIARIO_KEY }}
          PRUEBA: "1"
        run: |
          pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium
          python planilla.py ${{ inputs.planilla_prueba }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.planilla_prueba != '' }}
        with: { name: planilla-prueba, path: publicaciones/planillas }
      - name: Planilla del viernes (con los trades reales del diario)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          DIARIO_KEY: ${{ secrets.DIARIO_KEY }}
        run: |
          DIA=$(TZ=America/Argentina/Buenos_Aires date +%u); HORA=$(TZ=America/Argentina/Buenos_Aires date +%H)
          # viernes desde las 19, o sábado de madrugada si GitHub se atrasó más allá de la medianoche
          if { [ "$DIA" = "5" ] && [ "$HORA" -ge 19 ]; } || { [ "$DIA" = "6" ] && [ "$HORA" -lt 6 ]; }; then
            pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium
            python planilla.py
            git config user.name "publicador"
            git config user.email "publicador@users.noreply.github.com"
            git add publicaciones agenda.json
            if ! git diff --cached --quiet; then git commit -m "Planilla del viernes" && git push && sleep 60; fi
          else
            echo "No toca planilla"
          fi
      - name: Publicar lo que corresponda según la hora
        if: ${{ inputs.planilla_prueba == '' }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python publicar.py --auto
      - name: Registrar lo publicado
        if: ${{ always() && inputs.planilla_prueba == '' }}
        run: |
          git config user.name "publicador"
          git config user.email "publicador@users.noreply.github.com"
          git add publicado.json
          git diff --cached --quiet || (git commit -m "Registro de publicación" && git push)
