name: Publicar en Instagram
on:
  schedule:
    - cron: "0 22 * * *"   # 19:00 hora Argentina: carruseles
    - cron: "30 15 * * *"  # 12:30 hora Argentina: reels
  workflow_dispatch:
    inputs:
      planilla_prueba:
        description: "Solo prueba: arma la planilla de este viernes (AAAA-MM-DD) sin publicar"
        required: false
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Prueba de planilla (no publica nada)
        if: ${{ inputs.planilla_prueba != '' }}
        env:
          DIARIO_KEY: ${{ secrets.DIARIO_KEY }}
          PRUEBA: "1"
        run: |
          pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium
          python planilla.py ${{ inputs.planilla_prueba }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.planilla_prueba != '' }}
        with: { name: planilla-prueba, path: publicaciones/planillas }
      - name: Planilla del viernes (con los trades reales del diario)
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 22 * * *' }}
        env:
          DIARIO_KEY: ${{ secrets.DIARIO_KEY }}
        run: |
          if [ "$(TZ=America/Argentina/Buenos_Aires date +%u)" = "5" ]; then
            pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium
            python planilla.py
            git config user.name "publicador"
            git config user.email "publicador@users.noreply.github.com"
            git add publicaciones agenda.json
            if ! git diff --cached --quiet; then git commit -m "Planilla del viernes" && git push && sleep 60; fi
          else
            echo "No es viernes"
          fi
      - name: Publicar lo agendado para hoy
        if: ${{ inputs.planilla_prueba == '' }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          if [ "${{ github.event.schedule }}" = "30 15 * * *" ]; then python publicar.py --tipo reel; else python publicar.py --tipo carrusel; fi
      - name: Registrar lo publicado
        if: ${{ inputs.planilla_prueba == '' }}
        run: |
          git config user.name "publicador"
          git config user.email "publicador@users.noreply.github.com"
          git add publicado.json
          git diff --cached --quiet || (git commit -m "Registro de publicación" && git push)
